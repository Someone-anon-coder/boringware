# Everything that describes the hub and the products lives here. build.py reads it.
# Product facts must match each product's own site; check them there before changing.
#
# SEO content per product:
#   [[products.problems]]  one real problem, phrased the way people search for it. Each renders as a
#                          section on the product page (anchor #<id>) and is listed on the home page
#                          and /blog/. Fields: id, question, why, manual, tool, and optionally
#                          article = "<slug>" once an article covers it in depth.
#   [[products.faq]]       short questions and answers; also emitted as FAQPage structured data.
# Every sentence here must be true of the product and of Excel/Acrobat as they are today.

